# Robolectric 4.17 supports SDK 37, but its runtimes for SDK 35 and newer need Java 21, and the
# build and CI run on Java 17. SDK 34 is the newest one that runs on Java 17; raise it with the JDK.
sdk=34

# A plain Application instead of StudioApp: StudioApp starts Koin, and Koin's global context can be
# started once per process, while Robolectric creates the application again for every test. Tests
# that need the graph build their own.
application=android.app.Application
