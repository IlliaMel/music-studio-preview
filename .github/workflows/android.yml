name: Android

on:
  pull_request:
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
      - "docs/**"
      - "**.md"

# A new push to the same branch cancels the run that is already outdated.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check and assemble
    runs-on: ubuntu-latest
    # A full check plus all four builds takes about 25 minutes on a hosted runner.
    timeout-minutes: 45
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # Caches dependencies and build outputs between runs and validates the Gradle wrapper.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check and assemble both environments without signing secrets
        run: >-
          ./gradlew check
          assembleDevDebug assembleProdDebug
          assembleDevRelease assembleProdRelease
          --stacktrace

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-variants
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7

      # When the check fails, Lint's HTML report shows each problem with its explanation.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lint-reports
          path: "**/build/reports/lint-results-*.html"
          retention-days: 7
          if-no-files-found: ignore
